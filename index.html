<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Note IQ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f6a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Note IQ">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --ink:#1a1c22;--ink-soft:#5b606e;--paper:#f7f5ef;--paper-line:#dfe6ee;
  --card:#ffffff;--edge:#e7e4db;--accent:#2f6f6a;--accent-ink:#1d4f4b;
  --cog:#c9772f;--jdg:#3f7cc9;--sel:#7a5bb0;--exe:#c14b6a;
  --ok:#2f8f5b;--warn:#b8892a;--err:#c14b4b;
  --shadow:0 1px 2px rgba(26,28,34,.06),0 8px 24px rgba(26,28,34,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- login / setup gate ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--paper);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate.show{display:flex}
#gate .logo{font-size:34px;font-weight:800;color:var(--accent-ink);letter-spacing:-.02em;margin-bottom:6px}
#gate .logo span{color:var(--ink)}
#gate .sub{color:var(--ink-soft);font-size:14px;margin-bottom:28px}
.gcard{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--edge);
  background:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--ink)}
.gbtn:active{transform:scale(.99)}
.gcard h3{margin:0 0 6px;font-size:17px}
.gcard p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);text-align:left}
.gcard input{width:100%;border:1px solid var(--edge);border-radius:12px;padding:12px;font-family:inherit;font-size:15px;margin-bottom:12px}
.setup-steps{text-align:left;font-size:13px;color:var(--ink-soft);margin:0 0 16px;padding-left:2px}
.setup-steps div{margin-bottom:6px;display:flex;gap:8px}
.setup-steps b{color:var(--accent);flex-shrink:0}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.brand{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto}
.brand h1{font-size:20px;margin:0;letter-spacing:-.01em}
.brand .n{color:var(--accent-ink);font-weight:800}
.brand .tag{font-size:11px;color:var(--ink-soft);margin-left:auto}
.sync{width:8px;height:8px;border-radius:50%;background:#cfcabb;flex-shrink:0}
.sync.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync.synced{background:var(--ok)}
.sync.error{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}
.top-av{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer}
.top-av img{width:100%;height:100%;object-fit:cover}

body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.view{display:none;padding-top:16px}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.section{font-size:13px;color:var(--ink-soft);font-weight:600;margin:20px 2px 8px}

.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow)}
.card.pad{padding:16px}
.today{background:linear-gradient(180deg,#ffffff,#fbfaf6);border:1px solid var(--edge);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.today .row{display:flex;align-items:flex-end;gap:14px}
.today .big{font-size:44px;font-weight:800;line-height:1;color:var(--accent-ink);letter-spacing:-.02em}
.today .of{font-size:15px;color:var(--ink-soft);padding-bottom:4px}
.today .sub{font-size:13px;color:var(--ink-soft);margin-top:8px}
.bar{height:8px;background:#eceae2;border-radius:999px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
  padding:14px 16px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;width:100%;transition:transform .08s,filter .2s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--edge)}
.btn.soft{background:#eef2f1;color:var(--accent-ink)}
.btn.danger{background:#fff;color:var(--err);border:1px solid #eccaca}
.btn:disabled{opacity:.5;cursor:default}

.stepbar{display:flex;gap:6px;margin:2px 0 16px}
.stepbar .s{flex:1;height:4px;background:#e4e1d8;border-radius:999px}
.stepbar .s.on{background:var(--accent)}
.step{display:none}.step.on{display:block}
#reader{width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--edge)}
.hint{font-size:13px;color:var(--ink-soft);text-align:center;margin:10px 0}

.who{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--edge);border-radius:14px;background:#fff;margin-bottom:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.who .nm{font-weight:700;font-size:17px}.who .id{font-size:12px;color:var(--ink-soft)}

.drop{border:2px dashed var(--paper-line);border-radius:16px;background:
   linear-gradient(#fff,#fff) padding-box,
   repeating-linear-gradient(180deg,transparent 0 27px,var(--paper-line) 27px 28px) content-box;
  min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;text-align:center;cursor:pointer;color:var(--ink-soft)}
.drop b{color:var(--ink)}
.preview{width:100%;border-radius:12px;border:1px solid var(--edge);display:block}
.spin{width:22px;height:22px;border:3px solid #d8f0ec;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.thumbs .t{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--edge)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--edge);border-radius:12px;padding:12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;resize:vertical;line-height:1.6}
textarea:focus,input:focus{outline:2px solid #d8ece9;border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1.5px solid;background:#fff;cursor:pointer;user-select:none;transition:.15s}
.tag[data-k=cog]{color:var(--cog);border-color:var(--cog)}
.tag[data-k=jdg]{color:var(--jdg);border-color:var(--jdg)}
.tag[data-k=sel]{color:var(--sel);border-color:var(--sel)}
.tag[data-k=exe]{color:var(--exe);border-color:var(--exe)}
.tag.off{opacity:.35}
.tag.on[data-k=cog]{background:var(--cog);color:#fff}
.tag.on[data-k=jdg]{background:var(--jdg);color:#fff}
.tag.on[data-k=sel]{background:var(--sel);color:#fff}
.tag.on[data-k=exe]{background:var(--exe);color:#fff}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:#eef2f1;color:var(--accent-ink);padding:5px 10px;border-radius:8px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip x{cursor:pointer;font-weight:700;opacity:.6}

.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);cursor:pointer}
.prow .meta{flex:1;min-width:0}.prow .nm{font-weight:700}
.prow .last{font-size:12px;color:var(--ink-soft)}
.prow .cnt{font-size:12px;color:var(--accent-ink);font-weight:700;background:#eef2f1;padding:4px 9px;border-radius:999px}
.mini{display:flex;gap:3px;margin-top:6px}.mini i{height:5px;border-radius:2px;display:block}

.balance{display:flex;gap:8px;margin:6px 0 4px}
.bcol{flex:1;text-align:center}
.bcol .track{height:70px;background:#f0eee6;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.bcol .track>i{display:block;width:100%;border-radius:8px 8px 0 0;transition:height .5s}
.bcol .lb{font-size:11px;color:var(--ink-soft);margin-top:5px;font-weight:600}
.bcol .vv{font-size:11px;color:var(--ink)}
.wordtrend{display:flex;flex-wrap:wrap;gap:6px}
.wt{padding:5px 10px;border-radius:8px;font-size:13px;background:#eef2f1;color:var(--accent-ink)}
.wt.up{background:#e3f2ea;color:#1f6b45}.wt.up::after{content:" ↑";font-size:11px}
.timeline{position:relative;padding-left:20px;margin-top:6px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--paper-line)}
.tnote{position:relative;margin-bottom:14px}
.tnote::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.tnote .dt{font-size:12px;color:var(--ink-soft);font-weight:600;display:flex;justify-content:space-between}
.tnote .dt x{cursor:pointer;opacity:.5}
.tnote .sm{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:12px;margin-top:5px;box-shadow:var(--shadow)}
.tnote .sm .txt{font-size:14px;white-space:pre-wrap;word-break:break-word}
.tnote .sm .tg{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.teacher{font-size:13px;color:var(--accent-ink);background:#eef2f1;border-radius:8px;padding:7px 10px;margin-top:8px}
.teacher b{font-weight:700}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--edge);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;font-family:inherit;color:var(--ink-soft);font-size:11px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--accent-ink)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{stroke-width:2.1}

.empty{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:14px}
.empty .ico{font-size:34px;margin-bottom:8px;opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,-4px)}

.bc{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:12px 12px 8px;text-align:center;margin-bottom:10px}
.bc .nm{font-weight:700;margin-bottom:4px}
.bc svg{width:100%;max-height:70px}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow input{flex:1}.addrow button{width:auto;padding:12px 18px;white-space:nowrap}

.settings-row{display:flex;flex-direction:column;gap:10px}
.krow{display:flex;gap:8px}.krow input{flex:1}.krow button{width:auto;padding:12px 16px;white-space:nowrap}
.small{font-size:12px;color:var(--ink-soft)}

@media print{
  header,nav,.addrow,.section,.btn,.hint,.noprint{display:none!important}
  body{padding:0;background:#fff}
  .view{display:none!important}
  #v-cards{display:block!important;padding:0}
  #v-cards .bc{page-break-inside:avoid;display:inline-block;width:48%;margin:1%}
}
.modal{position:fixed;inset:0;z-index:200;background:rgba(26,28,34,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-inner{background:var(--paper);width:100%;max-width:640px;max-height:calc(100vh - env(safe-area-inset-top) - 24px);overflow-y:auto;border-radius:18px 18px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.modal-head{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 0 12px;margin-bottom:6px;font-weight:700;font-size:17px;z-index:1}
.modal-x{background:none;border:none;font-size:26px;line-height:1;color:var(--ink-soft);cursor:pointer;font-family:inherit}
input[type=date]{width:100%;border:1px solid var(--edge);border-radius:12px;padding:12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff}
.noterow-del{cursor:pointer;font-size:13px;font-weight:600;opacity:.85;white-space:nowrap}
</style>
</head>
<body>

<!-- ========== GATE (login) ========== -->
<div id="gate" class="show">
  <div class="logo"><span>Note</span> IQ</div>
  <div class="sub">紙のバスケノートを、成長の記録に。</div>

  <div class="gcard" id="login-card">
    <button class="gbtn" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-3.1-.4-4.6H24v9.1h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1C42.7 36.9 45 31 45 24z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.2-2.9.7-4.2v-5.7H4.5C3 17.1 2 20.4 2 24s1 6.9 2.5 9.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.5 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9.1 12.2-9.1z"/></svg>
      Googleでログイン
    </button>
    <p class="small" style="margin-top:14px;text-align:center">部の記録を安全に保存するためログインします</p>
  </div>

</div>

<!-- ========== HEADER ========== -->
<header>
  <div class="brand">
    <h1><span class="n">Note</span> IQ</h1>
    <span class="sync" id="sync"></span>
    <span class="tag" id="teamTag">東淀中学校 女子バスケ部</span>
    <div class="top-av" id="topAv" onclick="go('settings')"></div>
  </div>
</header>

<div class="wrap">

<!-- HOME -->
<section class="view active" id="v-home">
  <div class="today">
    <div class="row"><span class="big" id="h-done">0</span><span class="of">/ <span id="h-total">0</span> 人 提出</span></div>
    <div class="bar"><i id="h-bar" style="width:0%"></i></div>
    <div class="sub" id="h-date"></div>
  </div>
  <h2 class="section">今日やること</h2>
  <button class="btn primary" onclick="go('recv')" style="margin-bottom:10px">▤ ノートを受け付ける</button>
  <div style="display:flex;gap:10px">
    <button class="btn ghost" onclick="go('players')">選手を見る</button>
    <button class="btn ghost" onclick="go('cards')">バーコード発行</button>
  </div>
  <h2 class="section">未提出</h2>
  <div id="h-pending" class="plist"></div>
</section>

<!-- RECEPTION（提出チェックのみ） -->
<section class="view" id="v-recv">
  <h2 class="section">提出チェック（バーコードをスキャン）</h2>
  <div id="reader"></div>
  <p class="hint">スキャンすると今日の提出として記録します。カメラが出ないときは下から選手をタップ。</p>
  <div id="recvDone" class="plist" style="margin-bottom:12px"></div>
  <h2 class="section">選手をタップして提出記録</h2>
  <div id="quickpick" class="plist"></div>
</section>

<!-- PLAYERS -->
<section class="view" id="v-players">
  <h2 class="section">選手一覧</h2>
  <div id="playerList" class="plist"></div>
</section>

<!-- DETAIL -->
<section class="view" id="v-detail">
  <button class="btn ghost" onclick="go('players')" style="width:auto;padding:8px 14px;margin-bottom:14px">‹ 戻る</button>
  <div id="detailBody"></div>
</section>

<!-- CARDS -->
<section class="view" id="v-cards">
  <h2 class="section">選手を追加</h2>
  <div class="addrow"><input type="text" id="newName" placeholder="名前を入力" onkeydown="if(event.key==='Enter')addPlayer()"><button class="btn primary" onclick="addPlayer()">追加</button></div>
  <h2 class="section noprint">選手の管理</h2>
  <div id="manageList" class="plist noprint" style="margin-bottom:8px"></div>
  <h2 class="section">バーコード（印刷用）</h2>
  <p class="hint" style="text-align:left">印刷して選手証やノート表紙に貼り、受付でスキャンします。</p>
  <div id="cardArea"></div>
  <button class="btn soft noprint" onclick="window.print()" style="margin-top:12px">🖨 印刷 / PDF保存</button>
</section>

<!-- SETTINGS -->
<section class="view" id="v-settings">
  <h2 class="section">アカウント</h2>
  <div class="card pad" id="userCard" style="margin-bottom:14px"></div>
  <h2 class="section">チーム名</h2>
  <div class="card pad"><div class="krow"><input type="text" id="teamName" placeholder="チーム名"><button class="btn soft" onclick="saveTeam()">保存</button></div></div>
  <h2 class="section">　</h2>
  <button class="btn danger" onclick="doLogout()">ログアウト</button>
</section>

</div>

<nav>
  <button class="on" id="nav-home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>ホーム</button>
  <button id="nav-recv" onclick="go('recv')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>受付</button>
  <button id="nav-players" onclick="go('players')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M4 20c0-3 2.5-5 5-5s5 2 5 5"/><circle cx="17" cy="9" r="2.2"/><path d="M15.5 20c0-2 1-3.5 2.5-4"/></svg>選手</button>
  <button id="nav-cards" onclick="go('cards')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M7 9v6M10 9v6M13 9v6M17 9v6"/></svg>発行</button>
</nav>

<!-- 記録追加モーダル -->
<div class="modal" id="noteModal">
  <div class="modal-inner">
    <div class="modal-head"><span id="nmTitle">記録を追加</span><button class="modal-x" onclick="closeNoteModal()">×</button></div>
    <div class="field">
      <label>日付</label>
      <input type="date" id="nmDate">
    </div>
    <div class="field">
      <label>ノート全文</label>
      <textarea id="nmBody" rows="10" placeholder="ノートの内容を入力"></textarea>
    </div>
    <div class="field">
      <label>触れていた観点（タップで切替）</label>
      <div class="tags">
        <span class="tag on" data-k="cog" onclick="tglTag(this)">認知</span>
        <span class="tag on" data-k="jdg" onclick="tglTag(this)">判断</span>
        <span class="tag on" data-k="sel" onclick="tglTag(this)">選択</span>
        <span class="tag on" data-k="exe" onclick="tglTag(this)">実行</span>
      </div>
    </div>
    <div class="field">
      <label>キーワード</label>
      <div class="kw" id="nmKw"></div>
      <input type="text" id="nmKwAdd" placeholder="追加してEnter" style="margin-top:8px" onkeydown="if(event.key==='Enter'){addKw(this.value);this.value=''}">
    </div>
    <div class="field">
      <label>先生の一言（任意）</label>
      <textarea id="nmTeacher" rows="2" placeholder="この子に返したい言葉があれば"></textarea>
    </div>
    <button class="btn primary" onclick="saveNote()">保存する</button>
    <button class="btn ghost" onclick="closeNoteModal()" style="margin-top:8px">やめる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* ============================================================
   ▼▼▼ ここを Note IQ 専用の Firebase 設定に置き換えてください ▼▼▼
   （新しく作った Firebase プロジェクトの「ウェブアプリ」の firebaseConfig を貼る）
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCs4RArGRzhAb5DIf9W_9KB-M8YXsaXqIY",
  authDomain: "noteiq-5c55d.firebaseapp.com",
  projectId: "noteiq-5c55d",
  storageBucket: "noteiq-5c55d.firebasestorage.app",
  messagingSenderId: "917960355676",
  appId: "1:917960355676:web:4f32b1d71f3c6a0dc51b99",
  measurementId: "G-6RG56W42T1"
};
/* ▲▲▲ 置き換えここまで ▲▲▲ */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* ---------- state ---------- */
const K={cog:'認知',jdg:'判断',sel:'選択',exe:'実行'};
const Kcol={cog:'var(--cog)',jdg:'var(--jdg)',sel:'var(--sel)',exe:'var(--exe)'};
let players=[];
let teamName='東淀中学校 女子バスケ部';
let currentUser=null;
let unsub=null;
let seq=1;
const $=s=>document.querySelector(s);
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const today=todayStr();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function setSync(s){const el=$('#sync');el.className='sync '+s;}
function initials(n){return (n||'?').slice(0,1);}
function fmt(d){const[y,m,dd]=d.split('-');return `${+m}月${+dd}日`;}

/* ---------- auth ---------- */
window.doLogin=()=>{
  signInWithPopup(auth,provider).catch(e=>{
    console.error(e);
    if(e.code==='auth/popup-blocked'){
      alert('ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してから、もう一度お試しください。');
    }else if(e.code!=='auth/cancelled-popup-request'&&e.code!=='auth/popup-closed-by-user'){
      alert('ログインに失敗しました: '+(e.message||e.code));
    }
  });
};
window.doLogout=()=>{ if(unsub)unsub(); fbSignOut(auth); };

onAuthStateChanged(auth,user=>{
  if(!user){ currentUser=null; showGate('login'); return; }
  currentUser=user;
  launch();
});
function showGate(which){
  $('#gate').classList.add('show');
  $('#login-card').style.display = 'block';
}
function launch(){
  $('#gate').classList.remove('show');
  renderUser();
  subscribe(currentUser.uid);
}
function renderUser(){
  const u=currentUser;
  const av=$('#topAv');
  if(u.photoURL)av.innerHTML=`<img src="${u.photoURL}">`; else av.textContent=(u.displayName||'U')[0];
  $('#userCard').innerHTML=`<div style="display:flex;align-items:center;gap:12px">
    ${u.photoURL?`<div class="avatar" style="padding:0;overflow:hidden"><img src="${u.photoURL}" style="width:100%;height:100%;object-fit:cover"></div>`:`<div class="avatar">${(u.displayName||'U')[0]}</div>`}
    <div><div style="font-weight:700">${u.displayName||''}</div><div class="small">${u.email||''}</div></div></div>`;
  $('#teamName').value=teamName;
}

/* ---------- firestore ---------- */
function subscribe(uid){
  setSync('syncing');
  unsub=onSnapshot(doc(db,'noteiq',uid),snap=>{
    if(snap.exists()){
      const d=snap.data();
      players=Array.isArray(d.players)?d.players:[];
      if(d.teamName)teamName=d.teamName;
      if(d.seq)seq=d.seq;
      $('#teamTag').textContent=teamName;
    }else{
      // ドキュメントが一度も作られていない＝本当の初回だけ初期メンバーを入れる
      seedInitial();
      save();
    }
    setSync('synced');
    renderHome();
  },err=>{console.error(err);setSync('error');toast('⚠️ 同期エラー');});
}
async function save(){
  if(!currentUser)return;
  setSync('syncing');
  try{
    await setDoc(doc(db,'noteiq',currentUser.uid),{players,teamName,seq,updatedAt:new Date().toISOString()});
    setSync('synced');
  }catch(e){console.error(e);setSync('error');toast('⚠️ 保存に失敗しました');}
}
function seedInitial(){
  ['あみる','ひなか','ひなた','ここな','りな','ゆり'].forEach(n=>{
    players.push({id:'NIQ-'+String(seq++).padStart(4,'0'),name:n,notes:[]});
  });
}

/* ---------- nav ---------- */
window.go=v=>{
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  $('#v-'+v).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  const nb=$('#nav-'+v); if(nb)nb.classList.add('on');
  window.scrollTo(0,0);
  if(v!=='recv')stopScan();
  if(v==='home')renderHome();
  if(v==='players')renderPlayers();
  if(v==='cards')renderCards();
  if(v==='recv')startReception();
  if(v==='settings')renderUser();
};

/* ---------- home ---------- */
function renderHome(){
  const done=players.filter(p=>p.notes.some(n=>n.d===today)).length;
  const total=players.length;
  $('#h-done').textContent=done;$('#h-total').textContent=total;
  $('#h-bar').style.width=(total?done/total*100:0)+'%';
  $('#h-date').textContent=fmt(today)+'の提出状況';
  const pend=players.filter(p=>!p.notes.some(n=>n.d===today));
  $('#h-pending').innerHTML=pend.length?pend.map(p=>prow(p,true)).join(''):'<div class="empty">🎉 全員提出済み</div>';
}

/* ---------- reception（提出チェックのみ） ---------- */
let scanning=null;
function startReception(){
  renderRecvDone();
  $('#quickpick').innerHTML=players.length?players.map(p=>recvRow(p)).join(''):'<div class="empty">選手がいません。「発行」から追加してください。</div>';
  const box=$('#reader');box.innerHTML='';
  try{
    scanning=new Html5Qrcode("reader");
    scanning.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:120}},
      txt=>onScan(txt),()=>{}).catch(()=>{box.innerHTML='<div class="empty" style="padding:24px">カメラが使えません。下から選手をタップしてください。</div>';});
  }catch(e){box.innerHTML='<div class="empty" style="padding:24px">下から選手をタップしてください。</div>';}
}
function stopScan(){if(scanning){scanning.stop().then(()=>scanning.clear()).catch(()=>{});scanning=null;}}
function onScan(txt){const p=players.find(x=>x.id===txt)||players.find(x=>x.name===txt);if(p)markSubmitted(p.id);}
function recvRow(p){
  const done=p.notes.some(n=>n.d===today);
  return `<div class="prow" onclick="markSubmitted('${p.id}')">
    <div class="avatar">${initials(p.name)}</div>
    <div class="meta"><div class="nm">${p.name}</div><div class="last">${done?'✓ 今日提出済み':'タップで提出記録'}</div></div>
    <div class="cnt">${done?'済 ✓':'記録'}</div></div>`;
}
function renderRecvDone(){
  const done=players.filter(p=>p.notes.some(n=>n.d===today));
  $('#recvDone').innerHTML=done.length?`<div class="banner" style="color:var(--ok);background:#e7f5ee;border-color:#bfe6cf">今日の提出済み: ${done.map(p=>p.name).join('、')}</div>`:'';
}
window.markSubmitted=id=>{
  const p=players.find(x=>x.id===id);if(!p)return;
  if(p.notes.some(n=>n.d===today)){toast(p.name+' さんは提出済みです');return;}
  // 中身が空の「提出のみ」記録を作る（あとで詳細から追記できる）
  p.notes.push({d:today,s:'',k:[],kw:[],t:''});
  p.notes.sort((a,b)=>a.d<b.d?-1:1);
  save();toast(p.name+' さんの提出を記録しました');
  renderRecvDone();
  $('#quickpick').innerHTML=players.map(pp=>recvRow(pp)).join('');
};

/* ---------- 記録の手入力（モーダル） ---------- */
let curTags=[],curKw=[],editTarget=null; // editTarget={id,idx|null}
window.openNoteModal=(id,idx)=>{
  const p=players.find(x=>x.id===id);if(!p)return;
  editTarget={id,idx:(idx===undefined?null:idx)};
  const n=(idx!==undefined&&idx!==null)?p.notes[idx]:null;
  $('#nmTitle').textContent=(n?p.name+' さんの記録を編集':p.name+' さんの記録を追加');
  $('#nmDate').value=n?n.d:today;
  $('#nmBody').value=n?(n.s||''):'';
  $('#nmTeacher').value=n?(n.t||''):'';
  curTags=n?(n.k||[]).slice():['cog','jdg','sel','exe'];
  curKw=n?(n.kw||[]).slice():[];
  document.querySelectorAll('#noteModal .tag').forEach(t=>{const on=curTags.includes(t.dataset.k);t.classList.toggle('on',on);t.classList.toggle('off',!on);});
  renderKw();
  $('#noteModal').classList.add('open');
};
window.closeNoteModal=()=>{$('#noteModal').classList.remove('open');editTarget=null;};
window.tglTag=el=>{const k=el.dataset.k;
  if(curTags.includes(k)){curTags=curTags.filter(x=>x!==k);el.classList.add('off');el.classList.remove('on');}
  else{curTags.push(k);el.classList.remove('off');el.classList.add('on');}};
function renderKw(){$('#nmKw').innerHTML=curKw.map((w,i)=>`<span class="chip">${esc(w)}<x onclick="delKw(${i})">×</x></span>`).join('');}
window.addKw=w=>{w=w.trim();if(w&&!curKw.includes(w)){curKw.push(w);renderKw();}};
window.delKw=i=>{curKw.splice(i,1);renderKw();};
window.saveNote=()=>{
  if(!editTarget)return;
  const p=players.find(x=>x.id===editTarget.id);if(!p)return;
  const rec={d:$('#nmDate').value||today,s:$('#nmBody').value.trim(),k:curTags.slice(),kw:curKw.slice(),t:$('#nmTeacher').value.trim()};
  if(editTarget.idx===null){p.notes.push(rec);}else{p.notes[editTarget.idx]=rec;}
  p.notes.sort((a,b)=>a.d<b.d?-1:1);
  save();toast('保存しました');
  const id=editTarget.id;closeNoteModal();openDetail(id);
};

/* ---------- rows / balance ---------- */
function prow(p,pending,mode){
  const cnt=p.notes.length;
  const last=cnt?fmt(p.notes[p.notes.length-1].d):'記録なし';
  const bal=balance(p);
  const mini=cnt?`<div class="mini">${['cog','jdg','sel','exe'].map(k=>`<i style="flex:${bal[k]||0.15};background:${Kcol[k]}"></i>`).join('')}</div>`:'';
  return `<div class="prow" onclick="openDetail('${p.id}')">
    <div class="avatar">${initials(p.name)}</div>
    <div class="meta"><div class="nm">${p.name}</div>
      <div class="last">${pending?'今日まだ未提出':'最終: '+last+' ・ '+cnt+'件'}</div>${mini}</div>
    ${pending?'':'<div class="cnt">'+cnt+'</div>'}</div>`;
}
function balance(p){const c={cog:0,jdg:0,sel:0,exe:0};let t=0;p.notes.forEach(n=>n.k.forEach(k=>{if(c[k]!=null){c[k]++;t++;}}));if(!t)return c;Object.keys(c).forEach(k=>c[k]=c[k]/t);return c;}

/* ---------- players / detail ---------- */
function renderPlayers(){$('#playerList').innerHTML=players.map(p=>prow(p,false)).join('');}
window.openDetail=id=>{
  const p=players.find(x=>x.id===id);go('detail');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));$('#nav-players').classList.add('on');
  if(!p.notes.length){
    $('#detailBody').innerHTML=`<div class="avatar" style="margin-bottom:10px">${initials(p.name)}</div><h2 style="margin:0">${p.name}</h2>
      <div class="empty"><div class="ico">▤</div>まだ記録がありません。</div>
      <button class="btn primary" onclick="openNoteModal('${p.id}')">＋ 記録を追加</button>`;return;
  }
  const bal=balance(p),maxB=Math.max(...Object.values(bal),0.01);
  const balHtml=['cog','jdg','sel','exe'].map(k=>`<div class="bcol"><div class="track"><i style="height:${bal[k]/maxB*100}%;background:${Kcol[k]}"></i></div><div class="lb" style="color:${Kcol[k]}">${K[k]}</div><div class="vv">${Math.round(bal[k]*100)}%</div></div>`).join('');
  const wt=wordTrend(p);
  const tl=p.notes.slice().reverse().map((n,ri)=>{const realIdx=p.notes.length-1-ri;const empty=!n.s&&!(n.k&&n.k.length)&&!(n.kw&&n.kw.length)&&!n.t;return `<div class="tnote"><div class="dt"><span>${fmt(n.d)}${empty?'（提出のみ・内容未記入）':''}</span><span><x onclick="openNoteModal('${p.id}',${realIdx})" style="margin-right:12px">編集</x><x onclick="delNote('${p.id}',${realIdx})">削除</x></span></div>
    <div class="sm"><div class="txt">${esc(n.s)||'（本文なし）'}</div>
      <div class="tg">${n.k.map(k=>`<span class="dot" style="background:${Kcol[k]}"></span>`).join('')}${n.kw.map(w=>`<span class="wt">${esc(w)}</span>`).join('')}</div>
      ${n.t?`<div class="teacher"><b>先生:</b> ${esc(n.t)}</div>`:''}</div></div>`;}).join('');
  $('#detailBody').innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div class="avatar">${initials(p.name)}</div>
      <div><h2 style="margin:0">${p.name}</h2><div class="small">${p.notes.length}件の記録 ・ ${p.id}</div></div></div>
    <button class="btn primary" onclick="openNoteModal('${p.id}')" style="margin-top:10px">＋ 記録を追加</button>
    <div class="card pad" style="margin-top:12px"><h2 class="section" style="margin-top:0">観点のバランス</h2>
      <div class="balance">${balHtml}</div>
      <div class="hint" style="text-align:left;margin-top:10px">どの観点に多く触れて書いているか。実行に偏らず認知・判断が育つと成長のサイン。</div></div>
    ${wt.length?`<div class="card pad" style="margin-top:12px"><h2 class="section" style="margin-top:0">よく出る言葉</h2>
      <div class="wordtrend">${wt.map(w=>`<span class="wt ${w.up?'up':''}">${esc(w.w)}</span>`).join('')}</div>
      <div class="hint" style="text-align:left;margin-top:8px">↑ は最近増えてきた言葉。関心の変化が見えます。</div></div>`:''}
    <h2 class="section">記録の流れ</h2><div class="timeline">${tl}</div>`;
};
window.delNote=(id,idx)=>{if(!confirm('この記録を削除しますか？'))return;const p=players.find(x=>x.id===id);p.notes.splice(idx,1);save();openDetail(id);};
function wordTrend(p){
  const half=Math.ceil(p.notes.length/2),early={},late={},all={};
  p.notes.forEach((n,i)=>{const bag=i<half?early:late;(n.kw||[]).forEach(w=>{bag[w]=(bag[w]||0)+1;all[w]=(all[w]||0)+1;});});
  return Object.keys(all).sort((a,b)=>all[b]-all[a]).slice(0,6).map(w=>({w,up:(late[w]||0)>(early[w]||0)}));
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- barcode cards + 選手管理 ---------- */
function renderCards(){
  $('#cardArea').innerHTML=players.length?players.map(p=>`<div class="bc"><div class="nm">${esc(p.name)}</div><svg class="bcsvg" data-code="${p.id}"></svg></div>`).join(''):'<div class="empty noprint">選手がいません。上から追加してください。</div>';
  document.querySelectorAll('.bcsvg').forEach(svg=>{
    try{JsBarcode(svg,svg.dataset.code,{format:'CODE128',displayValue:true,fontSize:12,height:50,margin:4});}catch(e){}
  });
  renderManage();
}
function renderManage(){
  const box=$('#manageList');if(!box)return;
  box.innerHTML=players.length?players.map(p=>`<div class="prow">
    <div class="avatar">${initials(p.name)}</div>
    <div class="meta"><div class="nm">${esc(p.name)}</div><div class="last">${p.id} ・ ${p.notes.length}件の記録</div></div>
    <span class="noterow-del" onclick="renamePlayer('${p.id}')" style="margin-right:14px;color:var(--accent-ink)">名前変更</span>
    <span class="noterow-del" onclick="deletePlayer('${p.id}')" style="color:var(--exe)">削除</span>
  </div>`).join(''):'<div class="empty">選手がいません。</div>';
}
window.addPlayer=()=>{
  const n=$('#newName').value.trim();if(!n)return;
  players.push({id:'NIQ-'+String(seq++).padStart(4,'0'),name:n,notes:[]});
  $('#newName').value='';save();renderCards();toast(n+' さんを追加しました');
};
window.renamePlayer=id=>{
  const p=players.find(x=>x.id===id);if(!p)return;
  const v=prompt('新しい名前',p.name);
  if(v&&v.trim()){p.name=v.trim();save();renderCards();toast('名前を変更しました');}
};
window.deletePlayer=id=>{
  const p=players.find(x=>x.id===id);if(!p)return;
  if(!confirm(`${p.name} さんを削除しますか？\n${p.notes.length}件の記録もすべて消えます。この操作は元に戻せません。`))return;
  players=players.filter(x=>x.id!==id);
  save();renderCards();toast(`${p.name} さんを削除しました`);
};
window.saveTeam=()=>{const t=$('#teamName').value.trim();if(!t)return;teamName=t;$('#teamTag').textContent=t;save();toast('チーム名を保存しました');};

window.addEventListener('pagehide',stopScan);
</script>
<script>
/* PWA: Service Worker 登録 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW登録失敗', err));
  });
}
</script>
</body>
</html>
